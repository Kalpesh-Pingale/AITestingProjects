[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-qa-crew"
version = "1.0.0"
description = "AI-powered QA artifact generator: Jira MCP/REST + CrewAI + Streamlit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "crewai>=1.15.17,<2.0.0",
    "mcp>=1.28.1,<2.0.0",
    "streamlit>=1.40,<2.0.0",
    "pandas>=2.2,<4.0.0",
    "pydantic>=2.10,<3.0.0",
    "pydantic-settings>=2.6,<3.0.0",
    "requests>=2.32,<3.0.0",
    "python-dotenv>=1.0,<2.0.0",
    "PyYAML>=6.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jira_qa_crew"]

[tool.hatch.build.targets.wheel.force-include]
"src/jira_qa_crew/prompts/agents.yaml" = "jira_qa_crew/prompts/agents.yaml"
"src/jira_qa_crew/prompts/tasks.yaml" = "jira_qa_crew/prompts/tasks.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: hits a live Jira or LLM; opt-in only (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "S"]
ignore = [
    "E501",    # long lines are handled by the formatter
    "S101",    # assert is fine in tests
    "SIM108",  # ternaries are not always clearer
    "B008",    # Streamlit and Pydantic idioms rely on calls in defaults
    "UP042",   # str+Enum is deliberate: stable Pydantic JSON schema output
]

[tool.ruff.lint.isort]
known-first-party = ["jira_qa_crew", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "ARG001", "ARG002", "S311"]
"app.py" = ["E402"]
